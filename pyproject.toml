[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Just A Rather Very Intelligent System — a modular, local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["assistant", "ai", "local-first", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

# Phase 0 policy: ZERO runtime dependencies.
# See docs/DEPENDENCY_POLICY.md — every dependency must be justified before addition.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
